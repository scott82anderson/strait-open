<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Is the Strait of Hormuz open?</title>
<meta name="description" content="A live look at whether the Strait of Hormuz is open. Nope, it's closed." />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Is the Strait of Hormuz open?" />
<meta property="og:description" content="Nope, it's closed." />
<meta property="og:url" content="https://is-the-strait-open.com/" />
<meta property="og:image" content="https://is-the-strait-open.com/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="A ship stopped at a wall in the water, with the text: Nope, it's closed" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Is the Strait of Hormuz open?" />
<meta name="twitter:description" content="Nope, it's closed." />
<meta name="twitter:image" content="https://is-the-strait-open.com/og-image.png" />
<style>
  :root {
    --sky: #cfe8f5;
    --sky-2: #a8d4ea;
    --sea: #1c6e8c;
    --sea-2: #0f4c63;
    --wall: #4a4a4a;
    --ship: #b5402f;
    --ink: #0e2a36;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 4vh 5vw 8vh;
  }

  h1 {
    font-size: clamp(2.2rem, 7vw, 6rem);
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 0.6em;
    text-align: center;
  }

  .stage {
    width: 100%;
    display: block;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(15, 76, 99, 0.25);
  }

  svg { width: 100%; height: auto; display: block; }

  /* ---- Result block, hidden until animation finishes ---- */
  .result {
    text-align: center;
    margin-top: 6vh;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .result.show { opacity: 1; transform: translateY(0); }

  .verdict {
    font-size: clamp(2.4rem, 8vw, 6.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 1.2em;
    color: #b5402f;
  }

  .stat { margin: 1.6em 0; }

  .stat .label {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: clamp(0.7rem, 1.6vw, 0.95rem);
    font-weight: 700;
    opacity: 0.7;
    margin-bottom: 0.25em;
  }

  .stat .value {
    font-size: clamp(1.8rem, 5.5vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* ---------- Share buttons ---------- */
  .share {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.9em;
    margin-top: 3.5vh;
  }

  .share a {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    padding: 0.7em 1.1em;
    border-radius: 999px;
    text-decoration: none;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    font-weight: 700;
    color: #fff;
    background: var(--brand, #555);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .share a:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(14, 42, 54, 0.25);
    opacity: 0.95;
  }
  .share a svg { width: 1.15em; height: 1.15em; fill: currentColor; display: block; }

  .share .facebook { --brand: #1877f2; }
  .share .linkedin { --brand: #0a66c2; }
  .share .x        { --brand: #000000; }
  .share .reddit   { --brand: #ff4500; }

  footer {
    text-align: center;
    margin-top: 8vh;
    font-size: 0.8rem;
    opacity: 0.45;
  }

  /* ---------- Animation ---------- */
  /* Ship sails in from the right, stops at the wall's near edge, then sinks straight down */
  @keyframes sail-sink {
    0%   { transform: translate(1370px, 0); }   /* off-screen right */
    45%  { transform: translate(770px, 0); }    /* front touches near edge of wall */
    54%  { transform: translate(770px, 0); }    /* brief hold */
    100% { transform: translate(770px, 250px); }/* sinks slowly below the water */
  }
  /* Wall rises out of the water early, before the ship arrives */
  @keyframes wall-rise {
    0%   { transform: translateY(190px); }
    100% { transform: translateY(0); }
  }

  .ship-group {
    transform: translate(1370px, 0);
    animation: sail-sink 5s ease-in forwards;
  }
  .wall-group {
    transform: translateY(190px);
    animation: wall-rise 1.2s ease-out forwards;
    animation-delay: 0.3s;
  }

  /* gentle sea bobbing for the waterline highlight */
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  .wave-hi { animation: bob 3s ease-in-out infinite; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Is the Strait of Hormuz open?</h1>

    <svg class="stage" viewBox="0 0 1280 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animation of a ship hitting a wall and sinking">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dff0fa"/>
          <stop offset="1" stop-color="#a8d4ea"/>
        </linearGradient>
        <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a86a6"/>
          <stop offset="1" stop-color="#0c3c4f"/>
        </linearGradient>
        <!-- keep the rising wall and sinking ship from spilling out the bottom -->
        <clipPath id="stage"><rect x="0" y="0" width="1280" height="520"/></clipPath>
      </defs>

      <g clip-path="url(#stage)">
        <!-- Sky -->
        <rect x="0" y="0" width="1280" height="320" fill="url(#skyG)"/>
        <circle cx="1080" cy="90" r="44" fill="#fff3c4" opacity="0.9"/>

        <!-- Deep water (solid base) -->
        <rect x="0" y="300" width="1280" height="220" fill="url(#seaG)"/>

        <!-- Wall: rises out of the water, visible both above and below the surface -->
        <g class="wall-group">
          <rect x="600" y="150" width="80" height="280" fill="#4a4a4a"/>
          <rect x="600" y="150" width="80" height="16" fill="#5e5e5e"/>
          <!-- brick/rivet lines -->
          <rect x="600" y="190" width="80" height="3" fill="#3a3a3a"/>
          <rect x="600" y="230" width="80" height="3" fill="#3a3a3a"/>
          <rect x="600" y="270" width="80" height="3" fill="#3a3a3a"/>
          <rect x="600" y="310" width="80" height="3" fill="#3a3a3a"/>
          <rect x="600" y="350" width="80" height="3" fill="#3a3a3a"/>
        </g>

        <!-- Ship: sails in on the surface, stops at the wall, then sinks straight down -->
        <g class="ship-group" transform="translate(0,0)">
          <!-- hull -->
          <path d="M -90 250 L 90 250 L 70 300 L -70 300 Z" fill="#b5402f"/>
          <rect x="-70" y="300" width="140" height="22" fill="#8f2f22"/>
          <!-- deck house -->
          <rect x="-30" y="210" width="60" height="40" fill="#f2efe6"/>
          <rect x="-18" y="220" width="14" height="14" fill="#2a86a6"/>
          <rect x="6" y="220" width="14" height="14" fill="#2a86a6"/>
          <!-- funnel -->
          <rect x="36" y="206" width="20" height="44" fill="#3a3a3a"/>
          <rect x="36" y="206" width="20" height="10" fill="#b5402f"/>
          <!-- mast -->
          <rect x="-2" y="160" width="5" height="56" fill="#3a3a3a"/>
        </g>

        <!-- Translucent water overlay: tints anything that has sunk below the surface -->
        <rect x="0" y="300" width="1280" height="220" fill="url(#seaG)" opacity="0.5"/>
        <path class="wave-hi" d="M0 304 q 80 -14 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 V 320 H0 Z"
              fill="#ffffff" opacity="0.18"/>
      </g>
    </svg>

    <div class="result" id="result">
      <p class="verdict">Nope, still closed</p>

      <div class="stat">
        <div class="label">Days closed</div>
        <div class="value" id="days">—</div>
      </div>

      <div class="stat">
        <div class="label">Barrels of oil missing from global supply chain</div>
        <div class="value" id="barrels">—</div>
      </div>

      <nav class="share" aria-label="Share this page">
        <a class="facebook" id="share-facebook" target="_blank" rel="noopener" aria-label="Share on Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6 4.39 10.97 10.13 11.87v-8.4H7.08v-3.47h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.47h-2.8v8.4C19.61 23.04 24 18.07 24 12.07z"/></svg>
          Facebook
        </a>
        <a class="linkedin" id="share-linkedin" target="_blank" rel="noopener" aria-label="Share on LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
          LinkedIn
        </a>
        <a class="x" id="share-x" target="_blank" rel="noopener" aria-label="Share on X">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.46l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41z"/></svg>
          X
        </a>
        <a class="reddit" id="share-reddit" target="_blank" rel="noopener" aria-label="Share on Reddit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 11.78a2.57 2.57 0 0 0-4.34-1.85 12.6 12.6 0 0 0-6.9-2.2l1.18-5.53 3.85.82a1.83 1.83 0 1 0 .2-1.04l-4.3-.92a.52.52 0 0 0-.62.4l-1.32 6.2a12.6 12.6 0 0 0-7 2.2 2.57 2.57 0 1 0-2.83 4.18 5.07 5.07 0 0 0-.06.79c0 4.02 4.68 7.28 10.46 7.28S22.86 18.65 22.86 14.63a5.07 5.07 0 0 0-.06-.78A2.57 2.57 0 0 0 24 11.78zM6.4 13.6a1.83 1.83 0 1 1 3.66 0 1.83 1.83 0 0 1-3.66 0zm10.2 4.83c-1.25 1.25-3.64 1.34-4.34 1.34-.7 0-3.1-.09-4.34-1.34a.47.47 0 0 1 .66-.66c.79.79 2.47.97 3.68.97 1.21 0 2.9-.18 3.68-.97a.47.47 0 0 1 .66 0 .47.47 0 0 1 0 .66zm-.3-3a1.83 1.83 0 1 1 0-3.66 1.83 1.83 0 0 1 0 3.66z"/></svg>
          Reddit
        </a>
      </nav>
    </div>

    <footer>Updates automatically &middot; closed since 28 February 2026</footer>
  </div>

  <script>
    (function () {
      var CLOSED_SINCE = new Date(2026, 1, 28); // Feb is month index 1
      var MS_PER_DAY = 1000 * 60 * 60 * 24;

      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var days = Math.max(0, Math.floor((today - CLOSED_SINCE) / MS_PER_DAY));

      var barrelsMillions = days * 13;

      function fmt(n) { return n.toLocaleString("en-US"); }

      document.getElementById("days").textContent = fmt(days);
      document.getElementById("barrels").textContent =
        fmt(barrelsMillions) + " million";

      // ---- Share links ----
      var shareUrl = window.location.href;
      var shareText =
        "The Strait of Hormuz has been closed for " +
        fmt(days) + " days — " +
        fmt(barrelsMillions) + " million barrels of oil missing from global supply.";
      var u = encodeURIComponent(shareUrl);
      var t = encodeURIComponent(shareText);

      document.getElementById("share-facebook").href =
        "https://www.facebook.com/sharer/sharer.php?u=" + u;
      document.getElementById("share-linkedin").href =
        "https://www.linkedin.com/sharing/share-offsite/?url=" + u;
      document.getElementById("share-x").href =
        "https://twitter.com/intent/tweet?text=" + t + "&url=" + u;
      document.getElementById("share-reddit").href =
        "https://www.reddit.com/submit?url=" + u + "&title=" + t;

      // Reveal the result once the sinking animation (5s) has played out.
      window.setTimeout(function () {
        document.getElementById("result").classList.add("show");
      }, 5200);
    })();
  </script>
</body>
</html>
